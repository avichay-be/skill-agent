name: Deploy to Azure Container Apps

# NOTE: Deploy disabled — Azure service principal not available (DevOps issue).
# Re-enable push trigger when resolved.
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  AZURE_CONTAINER_APP_NAME: skill-agent-app
  AZURE_RESOURCE_GROUP: skill-agent-rg
  CONTAINER_REGISTRY_NAME: skillagentprodacr
  IMAGE_NAME: skill-agent

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SKILLAGENTAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SKILLAGENTAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SKILLAGENTAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR credentials
        id: acr-creds
        run: |
          ACR_NAME=$(az acr list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].name" -o tsv)
          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
          ACR_LOGIN_SERVER=$(az acr show --name $ACR_NAME --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query loginServer -o tsv)
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ steps.acr-creds.outputs.acr_name }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.acr-creds.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SKILLAGENTAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SKILLAGENTAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SKILLAGENTAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR credentials
        id: acr-creds
        run: |
          ACR_NAME=$(az acr list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].name" -o tsv)
          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
          ACR_LOGIN_SERVER=$(az acr show --name $ACR_NAME --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query loginServer -o tsv)
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT

      - name: Deploy to Azure Container Apps
        id: deploy
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GITHUB_REPO_URL: ${{ secrets.GITHUB_REPO_URL }}
        run: |
          SECRET_ARGS=()
          ENV_ARGS=()

          if [ -n "$ANTHROPIC_API_KEY" ]; then
            SECRET_ARGS+=("anthropic-api-key=$ANTHROPIC_API_KEY")
            ENV_ARGS+=("ANTHROPIC_API_KEY=secretref:anthropic-api-key")
          fi

          if [ -n "$OPENAI_API_KEY" ]; then
            SECRET_ARGS+=("openai-api-key=$OPENAI_API_KEY")
            ENV_ARGS+=("OPENAI_API_KEY=secretref:openai-api-key")
          fi

          if [ -n "$GOOGLE_API_KEY" ]; then
            SECRET_ARGS+=("google-api-key=$GOOGLE_API_KEY")
            ENV_ARGS+=("GOOGLE_API_KEY=secretref:google-api-key")
          fi

          if [ ${#SECRET_ARGS[@]} -gt 0 ]; then
            az containerapp secret set \
              --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --secrets "${SECRET_ARGS[@]}"
          fi

          if [ -n "$GITHUB_REPO_URL" ]; then
            ENV_ARGS+=("GITHUB_REPO_URL=$GITHUB_REPO_URL")
          fi

          ENV_ARGS+=(
            "ENVIRONMENT=production"
            "SKILLS_BASE_PATH=skills-library"
            "APP_NAME=Skill Agent"
            "LOG_LEVEL=INFO"
          )

          ACR_USERNAME=$(az acr credential show \
            --name ${{ steps.acr-creds.outputs.acr_name }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show \
            --name ${{ steps.acr-creds.outputs.acr_name }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query passwords[0].value -o tsv)

          az containerapp registry set \
            --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --server ${{ steps.acr-creds.outputs.acr_login_server }} \
            --username "$ACR_USERNAME" \
            --password "$ACR_PASSWORD"

          # Update container app with new image
          az containerapp update \
            --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ steps.acr-creds.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}:latest \
            --set-env-vars "${ENV_ARGS[@]}"

          # Get the app URL
          APP_URL=$(az containerapp show \
            --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)

          echo "url=https://$APP_URL" >> $GITHUB_OUTPUT
          echo "### Deployment Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "Application URL: https://$APP_URL" >> $GITHUB_STEP_SUMMARY
          echo "API Documentation: https://$APP_URL/docs" >> $GITHUB_STEP_SUMMARY

      - name: Verify deployment
        run: |
          APP_URL=$(az containerapp show \
            --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)

          echo "Waiting for application to be ready..."
          for i in {1..30}; do
            REVISION_HEALTH=$(az containerapp revision list \
              --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query "[?active].healthState | [0]" -o tsv)

            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$APP_URL/health" || true)

            if [ "$REVISION_HEALTH" = "Healthy" ] && { [ "$STATUS_CODE" = "200" ] || [ "$STATUS_CODE" = "401" ]; }; then
              echo "Application is healthy!"
              exit 0
            fi
            echo "Attempt $i: revision health=$REVISION_HEALTH, status=$STATUS_CODE. Waiting..."
            sleep 10
          done

          echo "Warning: Application did not become healthy within expected time"
          exit 1

      - name: Logout from Azure
        if: always()
        run: az logout
