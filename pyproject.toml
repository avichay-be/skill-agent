[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-agent"
version = "0.1.0"
description = "Event-driven skill loader and executor for LLM-based document extraction"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Avichay Ben Lulu"}
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "gitpython>=3.1.40",
    "anthropic>=0.40.0",
    "openai>=1.12.0",
    "google-generativeai>=0.4.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    "slowapi>=0.1.9",
    "pyyaml>=6.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "langsmith<0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
pydantic-ai = [
    "pydantic-ai>=0.0.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=60"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "slowapi.*",
    "langgraph.*",
    "langgraph_checkpoint_sqlite.*",
    "langchain_core.*",
    "google.generativeai.*",
]
ignore_missing_imports = true
